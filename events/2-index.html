<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>vaibhav borkar</h1>
    <button id="stop">stop</button>
  </body>
  <script>
    //    const name= function(){
    //         console.log("vaibhav");
    //     }
    //     setTimeout(name, 3000)

    const changeName = function () {
      document.querySelector("h1").innerHTML = "vaibhav from nagpur";
    };


    const stopIt = setTimeout(changeName, 3000);
    document.querySelector("#stop").addEventListener("click", function () {
      clearTimeout(stopIt);
      console.log('stop');  
    });


    const inter=function(){;
        console.log('vaibhav');
    }
    let clearId =setInterval(inter, 1000)
    clearInterval(clearId)

    
  </script>
</html>

<!-- 
note 
setTimeout allowed specific timed to execute the code
setInterval execute code per time/interval as defines
-->
